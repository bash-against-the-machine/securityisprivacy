<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }}{% else %}Security is Privacy{% endif %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/">
            &gt;_ <span>Security</span>is<span style="color:var(--accent)">Privacy</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link {% if page.nav_active == 'home' %}active{% endif %}" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if page.nav_active == 'guides' %}active{% endif %}" href="/guides/">Guides</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if page.nav_active == 'blog' %}active{% endif %}" href="/blog/">Blog</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if page.nav_active == 'news' %}active{% endif %}" href="/news/">News</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if page.nav_active == 'about' %}active{% endif %}" href="/about/">About</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

{{ content }}

<footer class="py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">
            <span class="accent">&gt;_</span> SecurityisPrivacy &mdash; knowledge is your best defense
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/copy-code.js"></script>
</body>
</html>
