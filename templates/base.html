{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Security is Privacy{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="{% url 'core:home' %}">
            &gt;_ <span>Security</span>is<span style="color:var(--accent)">Privacy</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link {% block nav_home %}{% endblock %}" href="{% url 'core:home' %}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% block nav_guides %}{% endblock %}" href="{% url 'guides:list' %}">Guides</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% block nav_blog %}{% endblock %}" href="{% url 'blog:list' %}">Blog</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% block nav_news %}{% endblock %}" href="{% url 'news:list' %}">News</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% block nav_about %}{% endblock %}" href="{% url 'core:about' %}">About</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

{% block content %}{% endblock %}

<footer class="py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">
            <span class="accent">&gt;_</span> SecurityisPrivacy &mdash; knowledge is your best defense
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
